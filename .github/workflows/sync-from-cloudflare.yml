name: Sync src from Cloudflare (live code -> repo)
# Descarcă codul care rulează efectiv pe Cloudflare și îl pune în src/index.js.
# Pornire manuală (Actions -> acest workflow -> Run workflow). Nu publică nimic pe Cloudflare.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarcă scriptul live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sfS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/maison-anaf-daily/content/v2" \
            -o live.js
          head -c 300 live.js
          grep -q "v2\." live.js
          mv live.js src/index.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet && echo "fara schimbari" || git commit -m "src/index.js = codul live de pe Cloudflare (maison-anaf-daily)"
          git push
