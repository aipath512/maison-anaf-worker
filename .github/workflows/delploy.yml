name: Deploy MAISON ANAF Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Deploy to Cloudflare
        # ATENȚIE: src/ din repo este v1.x, iar live rulează v2.8 (publicat în afara repo-ului).
        # Până la aducerea v2.8 în repo, se publică DOAR programarea (cron), nu codul.
        run: npx wrangler triggers deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
